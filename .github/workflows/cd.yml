name: CD Front-end

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull Docker image
        run: docker pull henryfranz/kore-front-end:latest

      - name: Stop Docker containers
        run: docker stop frontend-1 frontend-2 app-frontend || true

      - name: Remove Docker containers
        run: docker rm frontend-1 frontend-2 app-frontend || true

      - name: Run Docker container frontend-1
        run: docker run --name frontend-1 -d -p 127.0.0.1:3000:80 henryfranz/kore-front-end:latest

      - name: Run Docker container frontend-2
        run: docker run --name frontend-2 -d -p 127.0.0.1:3001:80 henryfranz/kore-front-end:latest