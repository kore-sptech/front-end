name: CD Front-end

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull Docker image
        run: docker pull ${{ secrets.DOCKERHUB_USER }}/NOME-DA-IMAGEM-FRONTEND:latest

      - name: Stop Docker container
        run: docker stop app-frontend || true

      - name: Remove Docker container
        run: docker rm app-frontend || true

      - name: Run Docker container
        run: docker run --name app-frontend -d -p 80:80 ${{ secrets.DOCKERHUB_USER }}/NOME-DA-IMAGEM-FRONTEND:latest